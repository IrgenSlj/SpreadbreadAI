[project]
name = "spreadbreadai-extension"
version = "0.1.0"
description = "LibreOffice Calc extension for SpreadbreadAI (Python UNO)"
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["python"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
