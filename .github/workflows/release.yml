name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-oxt:
    name: Build .oxt and create release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build SpreadbreadAI extension
        working-directory: extension
        run: |
          chmod +x build.sh
          ./build.sh
          ls -la spreadbreadai.oxt

      - name: Build daemon sdist + wheel
        working-directory: core
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: SpreadbreadAI ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            extension/spreadbreadai.oxt
            core/dist/*.whl
            core/dist/*.tar.gz
