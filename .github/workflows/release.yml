name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-oxt:
    name: Build .oxt + daemon distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build SpreadbreadAI extension
        working-directory: extension
        run: |
          chmod +x build.sh
          ./build.sh
          ls -la spreadbreadai.oxt

      - name: Build daemon sdist + wheel
        working-directory: core
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Upload .oxt as artifact (consumed by native bundle jobs)
        uses: actions/upload-artifact@v4
        with:
          name: spreadbreadai-oxt
          path: extension/spreadbreadai.oxt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: SpreadbreadAI ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            extension/spreadbreadai.oxt
            core/dist/*.whl
            core/dist/*.tar.gz

  bundle:
    name: Native bundle (${{ matrix.os }})
    needs: build-oxt
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            briefcase_format: dmg
            artifact_glob: "packaging/dist/*.dmg"
          - os: windows-latest
            briefcase_format: msi
            artifact_glob: "packaging/dist/*.msi"
          - os: ubuntu-latest
            briefcase_format: appimage
            artifact_glob: "packaging/dist/*.AppImage"
    runs-on: ${{ matrix.os }}
    continue-on-error: true   # Native bundles are nice-to-have until first signed release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull built .oxt into the launcher resources
        uses: actions/download-artifact@v4
        with:
          name: spreadbreadai-oxt
          path: packaging/src/spreadbreadai_launcher/

      - name: Install Briefcase
        run: pip install briefcase

      - name: Briefcase create / build / package
        working-directory: packaging
        shell: bash
        run: |
          briefcase create
          briefcase build
          briefcase package --adhoc-sign

      - name: Upload native bundle to the release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_glob }}
