name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install core (with dev extras)
        working-directory: core
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run core tests (skip live LLM)
        working-directory: core
        run: pytest -q --deselect tests/test_llm_live.py

      - name: Run extension tests
        working-directory: extension
        run: pytest -q -c pyproject.toml

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check core/spreadbread_core extension/python
