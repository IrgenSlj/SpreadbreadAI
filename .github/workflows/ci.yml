name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install core (with dev extras)
        working-directory: core
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run core tests (skip live LLM)
        working-directory: core
        run: pytest -q --deselect tests/test_llm_live.py

      - name: Run extension tests
        working-directory: extension
        run: pytest -q -c pyproject.toml

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check core/spreadbread_core extension/python

  cell_ref_in_sync:
    name: cell_ref vendored copy in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare implementations
        run: |
          # The two files have different module docstrings. Everything from
          # `from __future__` onward must be byte-identical so the parser
          # behavior is guaranteed identical in both packages.
          python - <<'PY'
          from pathlib import Path
          marker = "from __future__ import annotations"
          for path in ("core/spreadbread_core/cell_ref.py",
                       "extension/python/spreadbreadai/cell_ref.py"):
              text = Path(path).read_text()
              assert marker in text, f"{path}: missing anchor marker"
          core = Path("core/spreadbread_core/cell_ref.py").read_text()
          ext = Path("extension/python/spreadbreadai/cell_ref.py").read_text()
          core_body = core[core.index(marker):]
          ext_body = ext[ext.index(marker):]
          if core_body.rstrip() != ext_body.rstrip():
              import difflib
              diff = "".join(difflib.unified_diff(
                  core_body.splitlines(keepends=True),
                  ext_body.splitlines(keepends=True),
                  fromfile="core/spreadbread_core/cell_ref.py",
                  tofile="extension/python/spreadbreadai/cell_ref.py",
              ))
              print(diff)
              raise SystemExit("cell_ref implementations have diverged")
          print("cell_ref vendored copy is in sync")
          PY
