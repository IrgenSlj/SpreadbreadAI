[project]
name = "spreadbread-core"
version = "0.1.1"
description = "Local human-in-the-loop spreadsheet review daemon for SpreadbreadAI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "SpreadbreadAI contributors" }]
keywords = [
    "spreadsheet", "libreoffice", "calc", "ai", "llm",
    "ollama", "gemma", "human-in-the-loop", "fpa", "review",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Spreadsheet",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "openpyxl>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
spreadbread-core = "spreadbread_core.http:main"

[project.urls]
Homepage = "https://github.com/IrgenSlj/SpreadbreadAI"
Repository = "https://github.com/IrgenSlj/SpreadbreadAI"
Issues = "https://github.com/IrgenSlj/SpreadbreadAI/issues"
Changelog = "https://github.com/IrgenSlj/SpreadbreadAI/releases"
"Development plan" = "https://github.com/IrgenSlj/SpreadbreadAI/blob/main/docs/development-plan.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["spreadbread_core*"]
